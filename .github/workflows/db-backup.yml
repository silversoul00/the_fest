# Daily encrypted backup of THE FEST database (Supabase free plan has no backups).
#
# Setup (GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret):
#   BACKUP_DATABASE_URL  Supabase → Connect → "Session pooler" string (port 5432 on aws-…pooler.supabase.com).
#                        GitHub runners are IPv4-only, so the direct db.… address won't work.
#   BACKUP_PASSPHRASE    a long random passphrase. Keep a copy somewhere safe (password manager) —
#                        without it the backups can't be opened.
#
# The repo is public, so anyone can download artifacts: the dump is ENCRYPTED before upload and only
# the encrypted file is uploaded. Kept 30 days. Restore with scripts/restore.sh.
# Note: GitHub turns off scheduled workflows after 60 days with no activity in a public repo —
# re-enable it under Actions if that happens. "Run workflow" on the Actions tab runs it by hand.
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets first."
            exit 1
          fi

      - name: Install pg_dump matching the server's Postgres version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          MAJOR=$(psql "$BACKUP_DATABASE_URL" -qtAc "select current_setting('server_version_num')::int / 10000")
          echo "Server is Postgres $MAJOR"
          sudo apt-get install -y -qq "postgresql-client-$MAJOR"
          echo "/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        run: |
          pg_dump --version
          bash scripts/backup.sh backups

      - name: Upload the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: thefest-db-${{ github.run_id }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 30
